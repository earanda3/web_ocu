<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ocu</title>
    <link rel="icon" href="ocugat.svg" type="image/svg+xml">
    <link rel="alternate icon" href="ocugat.png" type="image/png">
    <link rel="stylesheet" href="vendor/pdf-viewer.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Welcome intro: a short centred phrase that floats over the already-visible words.
         Lines are injected by playIntro() in js/app.js. -->
    <div id="intro-overlay"></div>
    <div id="canvas">
        <div id="currency"
            style="position: absolute; left: 100px; top: 300px; font-size: 24px; color: #333; cursor: move; user-select: none;">
        </div>
        <div id="about-btn" style="position: absolute; left: 200px; top: 200px; cursor: move; user-select: none;">
            <img src="ocugat.png" alt="About" width="60" height="60" draggable="false">
        </div>
        <!-- New draggable word: color -->
        <a id="color-word" href="#"
            style="position: absolute; left: 600px; top: 240px; font-size: 24px; color: #333; cursor: move; user-select: none; letter-spacing: 2px;">color</a>
        <!-- New draggable word: newtro -->
        <a id="newtro-word" href="#"
            style="position: absolute; left: 720px; top: 240px; font-size: 24px; color: #333; cursor: move; user-select: none; letter-spacing: 2px;">newtro</a>
        <!-- Content words: wired up by fetchContentManifest() after intro -->
        <a id="cw-ocu3d" href="#"
            style="position: absolute; left: 300px; top: 350px; font-size: 24px; color: #333; cursor: move; user-select: none; letter-spacing: 2px;">ocu3D</a>
        <a id="cw-zines" href="#"
            style="position: absolute; left: 480px; top: 350px; font-size: 24px; color: #333; cursor: move; user-select: none; letter-spacing: 2px;">zines</a>
        <a id="cw-ocu" href="#"
            style="position: absolute; left: 620px; top: 350px; font-size: 24px; color: #333; cursor: move; user-select: none; letter-spacing: 2px;">ocu</a>
        <!-- Interactive words: wired up at load time -->
        <a id="serp-word" href="#"
            style="position: absolute; left: 80px; top: 420px; font-size: 24px; color: #333; cursor: move; user-select: none; letter-spacing: 2px;">Serp</a>
        <a id="afegir-word" href="#"
            style="position: absolute; left: 420px; top: 420px; font-size: 24px; color: #333; cursor: move; user-select: none; letter-spacing: 2px;">Afegir</a>
        <a id="arxius-word" href="#"
            style="position: absolute; left: 560px; top: 420px; font-size: 24px; color: #333; cursor: move; user-select: none; letter-spacing: 2px;">Arxius</a>
        <a id="tecla-link-word" href="https://tecla-code.github.io/TECLA/" target="_blank" rel="noopener noreferrer"
            style="position: absolute; left: 700px; top: 420px; font-size: 24px; color: #333; cursor: move; user-select: none; letter-spacing: 2px;">TECLA</a>
        <a id="ordre-word" href="#"
            style="position: absolute; left: 80px; top: 490px; font-size: 24px; color: #333; cursor: move; user-select: none; letter-spacing: 2px;">Ordre</a>
        <a id="info-word" href="#"
            style="position: absolute; left: 220px; top: 490px; font-size: 24px; color: #333; cursor: move; user-select: none; letter-spacing: 2px;">Info</a>
    </div>

    <!-- PDF Preview Modal -->
    <div id="pdf-modal" class="pdf-modal">
        <div class="pdf-modal-content">
            <div class="pdf-header"></div>
            <div class="resize-handle-ne"></div>
            <div class="resize-handle-sw"></div>
            <span class="pdf-close">&times;</span>
            <div id="pdf-container">
                <!-- PDF.js render target -->
                <div id="pdf-js-view">
                </div>
                <div class="pdf-controls">
                    <button id="download-pdf" title="Baixar PDF">&#x2B07;</button>
                    <span class="pdf-page-info">Fanzine</span>
                    <button id="open-external" title="Obrir en nova pestanya">&#x2197;</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Color Settings Modal -->
    <div id="color-modal" class="color-modal">
        <h3>Colors</h3>
        <div class="color-row">
            <label for="bg-color-input">Fons</label>
            <input id="bg-color-input" type="color" value="#ffffff" />
        </div>
        <div class="color-row">
            <label for="el-color-input">Elements</label>
            <input id="el-color-input" type="color" value="#333333" />
        </div>
        <div class="color-actions">
            <button id="color-reset">Reset</button>
            <button id="color-close">Tancar</button>
        </div>
    </div>

    <!-- Three.js is loaded once, at the end of <body>, right before stl-viewer.js
         (it's only used by the STL viewer, never by the inline code). -->
    <!-- PDF.js CDN — deferred: only used when a PDF is opened, so it must not block first paint. -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.9.179/pdf.min.js"></script>
    <!-- Content manifest: auto-generated by scripts/generate_manifest.py -->
    <script src="content/manifest.js"></script>
    <script src="js/app.js"></script>
    <!-- three.js is lazy-loaded on demand by stl-viewer.js (only when an STL opens). -->
    <script src="js/ui/stl-viewer.js"></script>
    <script src="js/ui/info-viewer.js"></script>
    <script src="js/ui/tecla-viewer.js"></script>
    <script src="js/app-init.js"></script>
    <!-- Screenshot button (html2canvas is lazy-loaded only on first use). -->
    <script src="js/ui/screenshot.js"></script>
</body>

</html>
