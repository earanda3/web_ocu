name: Deploy to ocu.cat (FTP)

# Deploy: syncs the site to the hosting over FTP using GitHub Secrets (credentials
# never appear in the repo). Replaces the old public github_deploy.php webhook
# (arbitrary-upload / RCE risk, flagged as malware by the hosting provider).
#
# NOTE: this hosting's FTP server (ocucat.ftp.tb-hosting.com, ProFTPD) does not
# support FTPS (no AUTH TLS, no port 990) — confirmed by probing it directly.
# Plain FTP is what's available; the credentials being in GitHub Secrets (not
# in the repo) is still the important security fix here.
#
# Uses lftp (not a JS FTP client) because this host's data-connections reset
# intermittently under GitHub Actions' cloud IPs. lftp retries transient FTP
# errors automatically instead of failing the whole deploy on one hiccup.
#
# Required repository secrets (Settings ▸ Secrets and variables ▸ Actions):
#   FTP_SERVER    ocucat.ftp.tb-hosting.com
#   FTP_USERNAME  your FTP user
#   FTP_PASSWORD  your FTP password
#   FTP_DIR       remote web root, e.g. ./www/   (trailing slash — confirm the
#                 exact path once logged into the FTP account)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🚀 Deploy over FTP
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout
        uses: actions/checkout@v4

      - name: 📦 Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -qq -y lftp

      - name: 🔎 Check secrets are set (lengths only, never the values)
        run: |
          echo "FTP_SERVER length:   ${#FTP_SERVER}"
          echo "FTP_USERNAME length: ${#FTP_USERNAME}"
          echo "FTP_PASSWORD length: ${#FTP_PASSWORD}"
          echo "FTP_DIR length:      ${#FTP_DIR}"
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}

      - name: 🗺️ Diagnose remote directory layout (read-only, no uploads)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
          set ftp:ssl-allow no;
          set net:max-retries 3;
          set net:timeout 15;
          open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\";
          echo '--- pwd on login ---';
          pwd;
          echo '--- ls -la at login dir ---';
          ls -la;
          echo '--- ls -la one level down (if any dirs exist) ---';
          !true;
          "

      - name: 📤 Sync to hosting
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          lftp -c "
          set ftp:ssl-allow no;
          set net:max-retries 8;
          set net:timeout 20;
          set net:reconnect-interval-base 5;
          set net:reconnect-interval-multiplier 1;
          set net:persist-retries 8;
          set mirror:parallel-transfer-count 1;
          open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\";
          mirror --reverse --verbose --only-newer --no-perms --parallel=1 \
            --exclude-glob .git/ \
            --exclude-glob .github/ \
            --exclude-glob .DS_Store \
            --exclude-glob Backup/ \
            --exclude-glob scripts/ \
            --exclude-glob py/ \
            --exclude-glob __pycache__/ \
            --exclude-glob '*.stl' \
            --exclude-glob '*.toe' \
            --exclude-glob '*.zip' \
            --exclude-glob server.py \
            --exclude-glob '*.command' \
            --exclude-glob executar_web_ocu.sh \
            --exclude-glob README.md \
            ./ \"$FTP_DIR\";
          "
