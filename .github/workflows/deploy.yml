name: Deploy to ocu.cat (FTP)

# Deploy: syncs the site to the hosting over FTP using GitHub Secrets (credentials
# never appear in the repo). Replaces the old public github_deploy.php webhook
# (arbitrary-upload / RCE risk, flagged as malware by the hosting provider).
#
# NOTE: this hosting's FTP server (ocucat.ftp.tb-hosting.com, ProFTPD) does not
# support FTPS (no AUTH TLS, no port 990) — confirmed by probing it directly.
# Plain FTP is what's available; the credentials being in GitHub Secrets (not
# in the repo) is still the important security fix here.
#
# Uses lftp (not a JS FTP client) because this host's data-connections reset
# intermittently under GitHub Actions' cloud IPs. lftp retries transient FTP
# errors automatically instead of failing the whole deploy on one hiccup.
#
# --delete is intentional: the live "www/" doc root still has the old
# github_deploy.php / diag*.php / lib/ / *.zip files from the previous
# insecure deploy method, and this is how they finally get removed from
# the server. The FTP_DIR guard below exists specifically so this never
# runs with an empty target (which would point --delete at the wrong dir).
#
# Required repository secrets (Settings ▸ Secrets and variables ▸ Actions):
#   FTP_SERVER    ocucat.ftp.tb-hosting.com
#   FTP_USERNAME  your FTP user
#   FTP_PASSWORD  your FTP password
#   FTP_DIR       www   (the account's real web document root)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🚀 Deploy over FTP
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout
        uses: actions/checkout@v4

      - name: 📦 Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -qq -y lftp

      - name: "🛡️ Guard: refuse to deploy if FTP_DIR is unset (protects --delete below)"
        run: |
          if [ -z "$FTP_DIR" ]; then
            echo "::error::FTP_DIR secret is empty. Refusing to run --delete mirror against an unknown directory."
            exit 1
          fi
          echo "FTP_DIR is set (length ${#FTP_DIR})."
        env:
          FTP_DIR: ${{ secrets.FTP_DIR }}

      - name: 🗜️ Build (minify JS/CSS + cache-bust, in place before upload)
        run: bash scripts/build_minify.sh "${GITHUB_SHA::8}"

      - name: 📤 Sync to hosting (mirrors repo, deletes stale remote files)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          # lftp often exits non-zero on this flaky host because the control
          # connection is reset AFTER the mirror has finished all transfers and
          # deletions. We don't fail the job on that here — the "Verify" step
          # below is the real gate (checks the live site over HTTP).
          # NOTE: *.stl is excluded from upload/delete on purpose: the real 3D
          # models already live on the server from before and are too big to
          # re-sync; content/ocu3D/*.stl stay as they are.
          lftp -c "
          set ftp:ssl-allow no;
          set net:max-retries 8;
          set net:timeout 20;
          set net:reconnect-interval-base 5;
          set net:reconnect-interval-multiplier 1;
          set net:persist-retries 8;
          set mirror:parallel-transfer-count 1;
          open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\";
          mirror --reverse --verbose --delete --only-newer --no-perms --parallel=1 \
            --exclude-glob .git/ \
            --exclude-glob .github/ \
            --exclude-glob .DS_Store \
            --exclude-glob Backup/ \
            --exclude-glob scripts/ \
            --exclude-glob py/ \
            --exclude-glob __pycache__/ \
            --exclude-glob '*.stl' \
            --exclude-glob '*.toe' \
            --exclude-glob server.py \
            --exclude-glob '*.command' \
            --exclude-glob executar_web_ocu.sh \
            --exclude-glob README.md \
            ./ \"$FTP_DIR\";
          " || echo "::warning::lftp exited non-zero (likely a trailing connection reset); verifying over HTTP next"

      - name: ✅ Verify deploy is live
        run: |
          sleep 5
          BODY=$(curl -fsS "https://ocu.cat/?cachebust=$(date +%s)")
          if echo "$BODY" | grep -q "vendor/pdf-viewer.css"; then
            echo "Live site is serving the current build."
          else
            echo "::error::Live index.html does not match the current build (deploy may be incomplete)."
            exit 1
          fi
